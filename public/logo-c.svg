<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!--
    C arc: opens on the right side.
    Center (250,250), outer radius=195, inner radius=125.
    Top tip at 45° CW-from-top  → (387.9, 112.1)
    Bottom tip at 135° CW-from-top → (387.9, 387.9)
    Arc spans 270° counterclockwise (CCW) in SVG screen coords.

    Color breakpoints (CCW from top tip):
      Blue  : 45° → 32°   (13° arc)
      Red   : 32° → 280°  (112° arc, crosses 0°/top)
      Yellow: 280° → 225° (55° arc)
      Green : 225° → 135° (90° arc)
  -->

  <!-- Blue: small tip at upper-right -->
  <path
    d="M 387.9 112.1
       A 195 195 0 0 0 353.3 84.6
       L 316.2 144.0
       A 125 125 0 0 1 338.4 161.6
       Z"
    fill="#4285F4"
  />

  <!-- Red: top arc (upper-right → top → left-ish) -->
  <path
    d="M 353.3 84.6
       A 195 195 0 0 0 57.9 216.1
       L 126.9 228.3
       A 125 125 0 0 1 316.2 144.0
       Z"
    fill="#EA4335"
  />

  <!-- Yellow: left side arc -->
  <path
    d="M 57.9 216.1
       A 195 195 0 0 0 112.1 387.9
       L 161.6 338.4
       A 125 125 0 0 1 126.9 228.3
       Z"
    fill="#FBBC05"
  />

  <!-- Green: bottom arc (lower-left → bottom → lower-right tip) -->
  <path
    d="M 112.1 387.9
       A 195 195 0 0 0 387.9 387.9
       L 338.4 338.4
       A 125 125 0 0 1 161.6 338.4
       Z"
    fill="#34A853"
  />
</svg>
