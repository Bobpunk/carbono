<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f9f9f9"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ededed" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Center content group -->
  <g transform="translate(600, 280)">
    <!-- Carbono hexagonal icon -->
    <g transform="translate(-40, -80)">
      <path
        d="M40 0 L76.6 21 L76.6 63 L40 84 L3.4 63 L3.4 21 Z"
        fill="#262626"
      />
      <path
        d="M40 28 L58.3 38.5 L58.3 59.5 L40 70 L21.7 59.5 L21.7 38.5 Z"
        fill="#f9f9f9"
      />
    </g>

    <!-- "carbono" text -->
    <text
      x="50"
      y="-22"
      font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-size="72"
      font-weight="600"
      letter-spacing="-0.035em"
      fill="#262626"
    >carbono</text>

    <!-- Tagline -->
    <text
      x="50"
      y="36"
      font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-size="24"
      font-weight="400"
      fill="rgba(38, 38, 38, 0.6)"
    >Nada se cria, tudo se copia!</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="#262626"/>
</svg>
